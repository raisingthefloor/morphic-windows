# ============================================================================================================
# This file belongs in the morphic-windows repo at:  .github/workflows/notify-localization.yml
# (morphic-windows is public, so its GitHub Actions are free.) It does NOT run from the loc repo. Before
# moving it into morphic-windows:
#   1. Register .azure/english-in.yml as a pipeline in Azure DevOps; note its numeric pipeline id (it is in
#      the pipeline's URL: .../_build?definitionId=<ID>).
#   2. Create an Azure DevOps PAT scoped to "Build (Read & execute)" and add it to the morphic-windows repo
#      as an Actions secret named AZDO_PIPELINE_PAT.
#   3. Fill in <AZDO_ORG>, <AZDO_PROJECT>, and <ENGLISH_IN_PIPELINE_ID> below, then commit it to morphic-windows.
# ============================================================================================================
name: Notify localization on English change

on:
  push:
    branches: [dev/2.x]
    paths:
      - 'Morphic/Strings/en-US/Resources.resw'   # ONLY an English-source change fires this

jobs:
  queue-english-in:
    runs-on: ubuntu-latest
    steps:
      - name: Queue the localization English-In pipeline (Azure DevOps)
        run: |
          curl -sf -X POST \
            -u ":$AZDO_PAT" \
            -H "Content-Type: application/json" \
            "https://dev.azure.com/raisingthefloor/Morphic/_apis/pipelines/34/runs?api-version=7.1" \
            -d '{"templateParameters": {"productSha": "${{ github.sha }}"}}'
        env:
          AZDO_PAT: ${{ secrets.AZDO_PIPELINE_PAT }}
